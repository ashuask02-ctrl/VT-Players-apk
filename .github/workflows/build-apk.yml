name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure environment configuration exists
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare Release Asset
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk vtplayer-debug.apk

      - name: Publish GitHub Release
        id: create_release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "VT Player v${{ github.run_number }} (Debug APK)"
          body: |
            ### VT Player Debug Build
            - Run: #${{ github.run_number }}
            - Commit: ${{ github.sha }}
            - Download `vtplayer-debug.apk` directly to your phone.
          draft: false
          prerelease: false
          files: vtplayer-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Workflow Summary
        if: always()
        run: |
          echo "## Build and Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Android Gradle Plugin (AGP):** 9.1.1" >> $GITHUB_STEP_SUMMARY
          echo "- **Gradle Version:** 9.3.1" >> $GITHUB_STEP_SUMMARY
          echo "- **Java Version:** 17 (Temurin)" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Actions Artifact:** Preserved as \`app-debug\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            echo "- **GitHub Release:** Published successfully under tag \`v${{ github.run_number }}\` with asset \`vtplayer-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **GitHub Release:** Publishing encountered an issue or was skipped (${{ steps.create_release.outcome }}). The Actions artifact remains available." >> $GITHUB_STEP_SUMMARY
          fi
